<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2D 躲避游戏</title>
<style>
body {
    margin: 0;
    background: #000;
    color: #fff;
    text-align: center;
    font-family: Arial;
}
canvas {
    background: #111;
    display: block;
    margin: 20px auto;
    border: 2px solid #fff;
}
</style>
</head>
<body>

<h1>我的第一个 2D 游戏</h1>
<p>方向键 / WASD 移动，躲避红色方块</p>

<canvas id="game" width="400" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// 玩家
const player = { x: 190, y: 460, size: 20, speed: 5 };

// 敌人
let enemies = [];
let gameOver = false;
let score = 0;

// 键盘
const keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

// 生成敌人
function spawnEnemy() {
    enemies.push({
        x: Math.random() * 380,
        y: -20,
        size: 20,
        speed: 2 + Math.random() * 3
    });
}

// 更新
function update() {
    if (gameOver) return;

    if (keys["ArrowLeft"] || keys["a"]) player.x -= player.speed;
    if (keys["ArrowRight"] || keys["d"]) player.x += player.speed;
    if (keys["ArrowUp"] || keys["w"]) player.y -= player.speed;
    if (keys["ArrowDown"] || keys["s"]) player.y += player.speed;

    player.x = Math.max(0, Math.min(380, player.x));
    player.y = Math.max(0, Math.min(480, player.y));

    enemies.forEach(e => e.y += e.speed);

    enemies.forEach(e => {
        if (
            player.x < e.x + e.size &&
            player.x + player.size > e.x &&
            player.y < e.y + e.size &&
            player.y + player.size > e.y
        ) {
            gameOver = true;
        }
    });

    enemies = enemies.filter(e => e.y < 500);
    score++;
}

// 绘制
function draw() {
    ctx.clearRect(0, 0, 400, 500);

    ctx.fillStyle = "lime";
    ctx.fillRect(player.x, player.y, player.size, player.size);

    ctx.fillStyle = "red";
    enemies.forEach(e => ctx.fillRect(e.x, e.y, e.size, e.size));

    ctx.fillStyle = "white";
    ctx.fillText("Score: " + score, 10, 20);

    if (gameOver) {
        ctx.font = "30px Arial";
        ctx.fillText("GAME OVER", 90, 250);
    }
}

setInterval(() => {
    update();
    draw();
}, 20);

setInterval(spawnEnemy, 800);
</script>

</body>
</html>
